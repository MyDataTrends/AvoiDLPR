name: CI

# Type-check, test and build on every push and pull request. No map data is needed: the tests
# that use the real Dallas data skip themselves when it isn't there, and the build doesn't bundle
# any (the app fetches it from VITE_DATA_BASE at runtime).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: npm ci
      - run: pip install -r requirements.txt

      - name: Type-check
        run: npm run typecheck

      - name: TypeScript tests
        run: npm test

      - name: Python tests
        run: python -m pytest -q pipeline spike/routing

      - name: Build the web app
        run: npm run build
        env:
          # Any https URL: only its origin matters here, for the Content-Security-Policy.
          VITE_DATA_BASE: https://data.example.com

      - name: The build contains no map data and no secrets
        run: |
          set -e
          test -f apps/web/dist/sw.js
          test -f apps/web/dist/_headers
          ! find apps/web/dist \( -name '*.fwr' -o -name '*.pmtiles' -o -name '*.key' -o -name '*.pem' \) | grep .
          du -sh apps/web/dist
