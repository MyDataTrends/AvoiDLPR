name: Refresh cameras

# Hourly: pull the latest camera locations from DeFlock's published tiles and publish the feed of
# every region that's online. The app revalidates the feeds on every load, so changes reach users
# within the hour. Roads and basemaps are left alone.
#
# Once a day it also deletes the road packs and basemaps that regions.json no longer names
# (superseded by the monthly build), once that manifest has been live for a day: it keeps the
# bucket at one copy of the map data, inside the storage free tier.
#
# Needs these in the repository's Settings > Secrets and variables > Actions:
#   secrets:   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   variables: R2_BUCKET
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-cameras
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  # R2 predates the newer default checksum headers of recent AWS tooling; only send them when required.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_BUCKET: ${{ vars.R2_BUCKET }}

jobs:
  refresh:
    # Until the bucket is configured, scheduled runs are skipped rather than failing (and emailing
    # you) every hour. A manual run still goes ahead, and the first step says what's missing.
    if: vars.R2_BUCKET != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Names a missing secret, and fails on a bucket it can't read, instead of taking either for
      # "nothing is published yet" below.
      - name: Check the bucket is set up and reachable
        run: bash .github/scripts/check-bucket.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The refresh refuses to replace a feed with one less than half its size (a DeFlock outage
      # must never publish an empty map), so it needs the feeds that are live; and it only
      # refreshes the regions the live manifest lists.
      - name: Download what's live
        id: live
        run: |
          mkdir -p release
          if aws s3 cp "s3://$R2_BUCKET/regions.json" release/regions.json --endpoint-url "$R2_ENDPOINT" --only-show-errors; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            aws s3 cp "s3://$R2_BUCKET/cameras" release/cameras --recursive --endpoint-url "$R2_ENDPOINT" --only-show-errors || true
          else
            echo "::notice::Nothing is published yet, so there's nothing to refresh: run Build map data first."
          fi

      - name: Refresh from DeFlock
        if: steps.live.outputs.published == 'true'
        run: python -m pipeline.refresh_cameras --out release --listed-in release/regions.json

      # Also after a partial failure: the regions that refreshed go out, the rest keep their feed.
      - name: Publish
        if: always() && steps.live.outputs.published == 'true'
        run: >
          aws s3 cp release/cameras "s3://$R2_BUCKET/cameras" --recursive
          --endpoint-url "$R2_ENDPOINT" --only-show-errors
          --content-type application/json
          --cache-control "public, max-age=0, must-revalidate"

      - name: Delete superseded map data (once a day)
        if: always() && steps.live.outputs.published == 'true'
        run: |
          set -e
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" != "05" ]; then exit 0; fi
          for prefix in packs/ basemap/; do
            aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix "$prefix" --endpoint-url "$R2_ENDPOINT" \
              --query 'Contents[].[Key,LastModified]' --output text >> listing.txt || true
          done
          # Files younger than a day are kept even if nothing names them yet: a build in progress
          # uploads its files before it publishes the manifest that points at them.
          python -m pipeline.prune --manifest release/regions.json --listing listing.txt > stale.txt
          echo "$(wc -l < stale.txt) superseded files to delete"
          while read -r key; do
            [ -n "$key" ] && aws s3 rm "s3://$R2_BUCKET/$key" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          done < stale.txt
