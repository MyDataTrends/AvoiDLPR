name: Build map data

# Monthly (and on demand): rebuild every region's road pack and basemap from fresh OpenStreetMap
# and Protomaps data, and publish a new release to the data bucket.
#
# Order matters. Big content-hashed files go first, cameras next, and regions.json (which names
# the files the app should use) last, so the app never sees a manifest that points at a file that
# isn't there yet. Old versions stay in the bucket, valid for pages that are still open; clear them
# out with an object lifecycle rule (docs/DEPLOY.md).
#
# Needs these in the repository's Settings > Secrets and variables > Actions:
#   secrets:   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   variables: R2_BUCKET, and optionally PMTILES_SHA256 (see the pmtiles step)
on:
  schedule:
    - cron: "0 6 3 * *"
  workflow_dispatch:
    inputs:
      region:
        description: "Region id to build (default: every region in pipeline/regions.json)"
        required: false

permissions:
  contents: read

concurrency:
  group: build-data
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  PMTILES_VERSION: "1.31.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          pip install -r requirements.txt

      # The official Protomaps CLI cuts a region's tiles out of the planet build with range
      # requests. It publishes no checksum file, so the hash is printed on every run; set the
      # PMTILES_SHA256 repository variable to that value to make the job refuse any other file.
      - name: Install the pmtiles CLI
        run: |
          set -e
          url="https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          curl -fL --retry 3 -o pmtiles.tar.gz "$url"
          actual="$(sha256sum pmtiles.tar.gz | cut -d' ' -f1)"
          echo "pmtiles ${PMTILES_VERSION} sha256: $actual"
          if [ -n "${{ vars.PMTILES_SHA256 }}" ] && [ "$actual" != "${{ vars.PMTILES_SHA256 }}" ]; then
            echo "::error::pmtiles checksum mismatch"; exit 1
          fi
          mkdir -p "$HOME/bin" && tar -xzf pmtiles.tar.gz -C "$HOME/bin" pmtiles
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - run: npm ci

      - name: Build each region
        env:
          ONLY_REGION: ${{ inputs.region }}
        run: |
          set -e
          ids="$(python -c "from pipeline.regions import load_regions; print(' '.join(r.id for r in load_regions()))")"
          for id in $ids; do
            if [ -n "$ONLY_REGION" ] && [ "$id" != "$ONLY_REGION" ]; then continue; fi
            echo "::group::$id"
            python -m pipeline.build_region "$id"
            node apps/web/scripts/fetch-basemap.mjs --region "$id"
            echo "::endgroup::"
          done

      - name: Refresh cameras and stage the release
        run: |
          set -e
          python -m pipeline.refresh_cameras --out release
          python -m pipeline.release
          ls -lhR release | head -60

      - name: Publish (immutable files, then cameras, then the manifest last)
        run: |
          set -e
          aws="aws s3 cp --endpoint-url $R2_ENDPOINT"
          $aws release/packs   "s3://$R2_BUCKET/packs"   --recursive --content-type application/octet-stream --cache-control "public, max-age=31536000, immutable"
          $aws release/basemap "s3://$R2_BUCKET/basemap" --recursive --cache-control "public, max-age=31536000, immutable"
          $aws release/cameras "s3://$R2_BUCKET/cameras" --recursive --content-type application/json --cache-control "public, max-age=0, must-revalidate"
          $aws release/regions.json "s3://$R2_BUCKET/regions.json" --content-type application/json --cache-control "public, max-age=0, must-revalidate"
