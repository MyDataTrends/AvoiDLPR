name: Build map data

# One pipeline, two schedules:
#
#   monthly  (the 3rd, 06:00 UTC)  full: every state downloaded fresh, every road pack and search
#                                  index rebuilt, and the basemap; the baseline that corrects any drift.
#   nightly  (07:30 UTC)           roads: each state's cached roads rolled forward with Geofabrik's
#                                  daily changes (a few MB), road packs rebuilt, the basemap and search
#                                  indexes left.
#
#   plan     checks every region lists the states it reaches into (pipeline/check_regions.py)
#            and splits the regions into batches of neighbouring states (pipeline/plan.py).
#   basemap  (full mode) the map of the whole lower 48 at zoom 15, about 16 GB in one file, cut out
#            of Protomaps' newest planet build (in a couple of minutes) and uploaded under a new
#            content-hashed name. Every region uses it; regions have no basemaps of their own.
#   build    one job per batch, in parallel. Builds its regions and decides, region by region,
#            whether the new pack replaces the live one (pipeline/decide.py): unchanged (same
#            fingerprint), published, deferred (a small change to a recent pack, so phones don't
#            re-download every fix), or held back (it failed the router's checks against the live
#            pack). Uploads what's published under new content-hashed names: nothing the app uses
#            changes yet.
#   publish  merges the batches with the manifest that's online (anything not published keeps
#            its live files), refreshes the cameras, and uploads regions.json only if it changed,
#            keeping the one it replaces as regions.prev.json for the daily cleanup's grace period.
#
# Without the bucket (the R2_BUCKET variable), or with "publish" unticked, it's a dry run: it all
# builds and the run's summary page lists every region's outcome and size; nothing is uploaded.
#
# Needs these in the repository's Settings > Secrets and variables > Actions:
#   secrets:   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   variables: R2_BUCKET, and optionally PMTILES_SHA256 (see the pmtiles step)
on:
  schedule:
    - cron: "0 6 3 * *" # full
    - cron: "30 7 * * *" # roads
  workflow_dispatch:
    inputs:
      region:
        description: "Region id to build (default: every region in pipeline/regions.json)"
        required: false
      mode:
        description: "full: fresh downloads and basemaps (the monthly build); roads: the nightly update"
        type: choice
        options: [full, roads]
        default: full
      publish:
        description: "Upload to the bucket (untick for a dry run)"
        type: boolean
        default: true
      basemap:
        description: "full mode: cut the basemap of the whole country too (about 16 GB, 20+ minutes)"
        type: boolean
        default: true
      rewind:
        description: "roads mode: re-apply this many of the latest daily change files (harmless; for testing)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: build-data
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  # R2 predates the newer default checksum headers of recent AWS tooling; only send them when required.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  MODE: ${{ (github.event.schedule == '30 7 * * *' && 'roads') || inputs.mode || 'full' }}
  # "true" when the bucket is set up, unless a manual run unticked "publish".
  PUBLISH: ${{ vars.R2_BUCKET != '' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
  PMTILES_VERSION: "1.31.2"

jobs:
  plan:
    # The scheduled runs wait for the bucket; a manual run always goes (as a dry run without it).
    if: vars.R2_BUCKET != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      # "success" when the bucket can be read: only then is the live manifest compared with.
      bucket: ${{ steps.bucket.outcome }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # With a bucket, say now if it can't be used, not after the build. A run that publishes
      # stops here; a dry run carries on without it, treating every region as new.
      - name: Check the bucket is set up and reachable
        id: bucket
        if: env.R2_BUCKET != ''
        continue-on-error: ${{ env.PUBLISH != 'true' }}
        run: bash .github/scripts/check-bucket.sh

      - name: Check each region lists every state it reaches into
        run: python -m pipeline.check_regions

      - name: Plan the batches
        id: plan
        env:
          ONLY_REGION: ${{ inputs.region }}
        run: python -m pipeline.plan ${ONLY_REGION:+--region "$ONLY_REGION"} --github-output

  build:
    needs: plan
    name: build ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          pip install -r requirements.txt
          osmium --version | head -1

      # What's online decides what's new, unchanged or worth replacing.
      - name: Download the live manifest
        if: needs.plan.outputs.bucket == 'success'
        run: |
          mkdir -p live
          aws s3 cp "s3://$R2_BUCKET/regions.json" live/regions.json --endpoint-url "$R2_ENDPOINT" --only-show-errors \
            || echo "nothing is published yet"

      # The nightly update rolls these forward; the monthly build replaces them, and saves them for it.
      - name: Restore the cached roads
        if: env.MODE == 'roads'
        uses: actions/cache/restore@v6
        with:
          path: work/roads
          key: roads-v1-${{ matrix.batch }}-${{ github.run_id }}
          restore-keys: roads-v1-${{ matrix.batch }}-

      - name: Build the batch's regions
        env:
          BATCH: ${{ matrix.batch }}
          REGIONS: ${{ join(matrix.regions, ' ') }}
          REWIND: ${{ inputs.rewind }}
        run: |
          args=""; for id in $REGIONS; do args="$args --region $id"; done
          python -m pipeline.build_batch "$BATCH" $args --mode "$MODE" --rewind "${REWIND:-0}" --no-basemap \
            --live live/regions.json --report "reports/$BATCH.json"

      - name: Save the roads for the next nightly update
        if: always() && hashFiles('work/roads/*.state.json') != ''
        uses: actions/cache/save@v6
        with:
          path: work/roads
          key: roads-v1-${{ matrix.batch }}-${{ github.run_id }}

      - name: Stage what's published
        if: always()
        env:
          BATCH: ${{ matrix.batch }}
          REGIONS: ${{ join(matrix.regions, ' ') }}
        run: |
          args=""; for id in $REGIONS; do args="$args --region $id"; done
          python -m pipeline.release --part "$BATCH" $args --live live/regions.json --national
          du -sh release/packs release/basemap release/places 2>/dev/null || true

      - name: Upload the new packs and search indexes (new names, so nothing live changes yet)
        if: env.PUBLISH == 'true'
        run: |
          set -e
          aws="aws s3 cp --endpoint-url $R2_ENDPOINT --only-show-errors"
          if [ -d release/packs ]; then
            $aws release/packs "s3://$R2_BUCKET/packs" --recursive --content-type application/gzip --cache-control "public, max-age=31536000, immutable"
          fi
          if [ -d release/basemap ]; then
            $aws release/basemap "s3://$R2_BUCKET/basemap" --recursive --cache-control "public, max-age=31536000, immutable"
          fi
          if [ -d release/places ]; then
            $aws release/places "s3://$R2_BUCKET/places" --recursive --content-type application/gzip --cache-control "public, max-age=31536000, immutable"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: part-${{ matrix.batch }}
          path: |
            release/parts/
            reports/
          if-no-files-found: ignore
          retention-days: 14

  basemap:
    needs: plan
    if: >-
      needs.plan.result == 'success' && github.event.schedule != '30 7 * * *'
      && (github.event_name != 'workflow_dispatch' || (inputs.mode == 'full' && inputs.basemap))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # The official Protomaps CLI cuts the country's tiles out of the planet build with range
      # requests. It publishes no checksum file, so the hash is printed on every run; set the
      # PMTILES_SHA256 repository variable to that value to make the job refuse any other file.
      - name: Install the pmtiles CLI
        run: |
          set -e
          url="https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          curl -fL --retry 3 -o pmtiles.tar.gz "$url"
          actual="$(sha256sum pmtiles.tar.gz | cut -d' ' -f1)"
          echo "pmtiles ${PMTILES_VERSION} sha256: $actual"
          if [ -n "${{ vars.PMTILES_SHA256 }}" ] && [ "$actual" != "${{ vars.PMTILES_SHA256 }}" ]; then
            echo "::error::pmtiles checksum mismatch"; exit 1
          fi
          mkdir -p "$HOME/bin" && tar -xzf pmtiles.tar.gz -C "$HOME/bin" pmtiles
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # 16 GB, under /mnt: on some runners a second disk, on today's the same one with some 85 GB
      # free (the step prints both). The staged copy is a hard link, not a second 16 GB.
      - name: Make room under /mnt
        run: |
          df -h / /mnt
          sudo mkdir -p /mnt/fw/data /mnt/fw/release
          sudo chown -R "$(id -u):$(id -g)" /mnt/fw
          ln -s /mnt/fw/data data

      - name: The lower 48's outline
        run: python -m pipeline.us_outline --out lower48.geojson

      - name: Cut the basemap
        run: node apps/web/scripts/fetch-basemap.mjs --us --outline lower48.geojson

      - name: Stage it
        run: |
          python -m pipeline.release --basemap --out /mnt/fw/release
          ls -l /mnt/fw/release/basemap
          df -h /mnt

      - name: Upload it (a new name, so nothing live changes yet)
        if: env.PUBLISH == 'true'
        run: |
          aws configure set default.s3.multipart_chunksize 64MB
          aws s3 cp /mnt/fw/release/basemap "s3://$R2_BUCKET/basemap" --recursive --endpoint-url "$R2_ENDPOINT" \
            --only-show-errors --cache-control "public, max-age=31536000, immutable"

      # Its manifest entry, for publish (a single file: it lands at the artifact's root).
      - uses: actions/upload-artifact@v7
        with:
          name: basemap-part
          path: /mnt/fw/release/parts/basemap.json
          retention-days: 14

  publish:
    needs: [plan, build, basemap]
    # Runs when some batches failed too: their regions keep the files that are online now.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v8
        with:
          pattern: part-*
          merge-multiple: true
          path: built

      # The country's basemap, when this run cut one; otherwise the live manifest's stays.
      - uses: actions/download-artifact@v8
        if: needs.basemap.result == 'success'
        with:
          name: basemap-part
          path: built/release/parts

      - name: Fonts and sprites
        run: node apps/web/scripts/fetch-basemap.mjs --assets-only

      # The camera refresh won't replace a feed with one less than half its size, so it needs
      # the feeds that are live; and regions that weren't rebuilt keep their live manifest entry.
      - name: Download what's live
        if: needs.plan.outputs.bucket == 'success'
        run: |
          mkdir -p live release
          aws s3 cp "s3://$R2_BUCKET/regions.json" live/regions.json --endpoint-url "$R2_ENDPOINT" || echo "no manifest online yet"
          aws s3 cp "s3://$R2_BUCKET/cameras" release/cameras --recursive --endpoint-url "$R2_ENDPOINT" --only-show-errors || true

      - name: Refresh the cameras
        run: python -m pipeline.refresh_cameras --out release || echo "::warning::some camera feeds didn't refresh (see the log); they keep their current feed"

      - name: Assemble regions.json
        run: |
          mkdir -p release/parts
          cp built/release/parts/*.json release/parts/ 2>/dev/null || true
          python -m pipeline.release --assemble --live live/regions.json --changed-flag changed.txt
          echo "manifest changed: $(cat changed.txt)"

      - name: Summary
        if: always()
        run: python -m pipeline.report built/reports/*.json --release release >> "$GITHUB_STEP_SUMMARY"

      - name: Publish (fonts, cameras, then the manifest last, if it changed)
        if: env.PUBLISH == 'true'
        run: |
          set -e
          aws="aws s3 cp --endpoint-url $R2_ENDPOINT --only-show-errors"
          $aws release/basemap/assets "s3://$R2_BUCKET/basemap/assets" --recursive --cache-control "public, max-age=31536000, immutable"
          $aws release/cameras "s3://$R2_BUCKET/cameras" --recursive --content-type application/json --cache-control "public, max-age=0, must-revalidate"
          if [ "$(cat changed.txt)" = "true" ]; then
            # The cleanup gives the files of the manifest being replaced a day's grace.
            if [ -f live/regions.json ]; then
              $aws live/regions.json "s3://$R2_BUCKET/regions.prev.json" --content-type application/json --cache-control "public, max-age=0, must-revalidate"
            fi
            $aws release/regions.json "s3://$R2_BUCKET/regions.json" --content-type application/json --cache-control "public, max-age=0, must-revalidate"
            echo "Published $(python -c "import json; print(len(json.load(open('release/regions.json'))['regions']))") regions." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No road pack, search index or basemap changed, so regions.json stays as it is." >> "$GITHUB_STEP_SUMMARY"
          fi
